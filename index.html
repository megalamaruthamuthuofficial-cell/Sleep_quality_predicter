<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sleep Quality Predictor</title>

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Loader CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/loader.css') }}">

    <!-- JavaScript -->
    <script defer
            src="{{ url_for('static', filename='js/script.js') }}">
    </script>

    <!-- Loader JavaScript -->
    <script defer
            src="{{ url_for('static', filename='js/loader.js') }}">
    </script>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>😴 Sleep Quality Predictor</h1>

            <p class="subtitle">
                Predict your Sleep Quality using Machine Learning
            </p>

            <form action="/predict"
                  method="POST">

                <!-- ========================= -->
                <!-- Row 1 -->
                <!-- ========================= -->

                <div class="row">

                    <div class="input-box">

                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Enter your age"
                            min="1"
                            max="100"
                            required>

                    </div>

                    <div class="input-box">

                        <label for="gender">
                            Gender
                        </label>

                        <select
                            id="gender"
                            name="gender"
                            required>

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                        </select>

                    </div>

                </div>

<!-- ========================= -->
                <!-- Row 2 -->
                <!-- ========================= -->

                <div class="row">

                    <div class="input-box">

                        <label for="bedtime">
                            Bedtime
                        </label>

                        <input
                            type="time"
                            id="bedtime"
                            name="bedtime"
                            required>

                    </div>

                    <div class="input-box">

                        <label for="wakeup_time">
                            Wakeup Time
                        </label>

                        <input
                            type="time"
                            id="wakeup_time"
                            name="wakeup_time"
                            required>

                    </div>

                </div>

                <!-- ========================= -->
                <!-- Row 3 -->
                <!-- ========================= -->

                <div class="row">

                    <div class="input-box">

                        <label for="sleep_duration">
                            Sleep Duration (Hours)
                        </label>

                        <input
                            type="number"
                            id="sleep_duration"
                            name="sleep_duration"
                            step="0.1"
                            min="0"
                            max="24"
                            placeholder="Example: 7.5"
                            required>

                    </div>

                    <div class="input-box">

                        <label for="rem_sleep">
                            REM Sleep Percentage
                        </label>

                        <input
                            type="number"
                            id="rem_sleep"
                            name="rem_sleep"
                            min="0"
                            max="100"
                            placeholder="Example: 20"
                            required>

                    </div>

                </div>
<!-- ========================= -->
                <!-- Row 4 -->
                <!-- ========================= -->

                <div class="row">

                    <div class="input-box">

                        <label for="deep_sleep">
                            Deep Sleep Percentage
                        </label>

                        <input
                            type="number"
                            id="deep_sleep"
                            name="deep_sleep"
                            min="0"
                            max="100"
                            placeholder="Example: 25"
                            required>

                    </div>

                    <div class="input-box">

                        <label for="light_sleep">
                            Light Sleep Percentage
                        </label>

                        <input
                            type="number"
                            id="light_sleep"
                            name="light_sleep"
                            min="0"
                            max="100"
                            placeholder="Example: 55"
                            required>

                    </div>

                </div>

                <!-- ========================= -->
                <!-- Row 5 -->
                <!-- ========================= -->

                <div class="row">

                    <div class="input-box">

                        <label for="awakenings">
                            Awakenings
                        </label>

                        <input
                            type="number"
                            id="awakenings"
                            name="awakenings"
                            min="0"
                            max="20"
                            placeholder="Example: 2"
                            required>

                    </div>

                    <div class="input-box">

                        <label for="caffeine">
                            Caffeine Consumption
                        </label>

                        <input
                            type="number"
                            id="caffeine"
                            name="caffeine"
                            step="0.1"
                            min="0"
                            placeholder="Example: 1"
                            required>

                    </div>

                </div>
<!-- ========================= -->
                <!-- Row 6 -->
                <!-- ========================= -->

                <div class="row">

                    <div class="input-box">

                        <label for="alcohol">
                            Alcohol Consumption
                        </label>

                        <input
                            type="number"
                            id="alcohol"
                            name="alcohol"
                            step="0.1"
                            min="0"
                            placeholder="Example: 0"
                            required>

                    </div>

                    <div class="input-box">

                        <label for="smoking_status">
                            Smoking Status
                        </label>

                        <select
                            id="smoking_status"
                            name="smoking_status"
                            required>

                            <option value="">
                                Select Status
                            </option>

                            <option value="No">
                                No
                            </option>

                            <option value="Yes">
                                Yes
                            </option>

                        </select>

                    </div>

                </div>

                <!-- ========================= -->
                <!-- Row 7 -->
                <!-- ========================= -->

                <div class="row">

                    <div class="input-box">

                        <label for="exercise_frequency">
                            Exercise Frequency (Days / Week)
                        </label>

                        <input
                            type="number"
                            id="exercise_frequency"
                            name="exercise_frequency"
                            min="0"
                            max="7"
                            placeholder="Example: 5"
                            required>

                    </div>

                </div>

                <!-- ========================= -->
                <!-- Predict Button -->
                <!-- ========================= -->

                <div class="button-box">

                    <button
                        type="submit"
                        onclick="showLoader()">

                        🔍 Predict Sleep Quality

                    </button>

                </div>
<!-- ========================= -->
                <!-- Loading Animation -->
                <!-- ========================= -->

            </form>

        </div>

    </div>

    <!-- Loader -->

    <div id="loader" class="loader-container">

        <div class="loader"></div>

        <h2>Analyzing Your Sleep...</h2>

        <p>
            Please wait while our Machine Learning model predicts your sleep quality.
        </p>

    </div>

</body>

</html>
